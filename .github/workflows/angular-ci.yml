name: Angular CI Pipeline

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: 18
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci --registry=https://registry.npmjs.org/

      - name: Build Angular App
        run: npm run build -- --configuration production

      - name: Run Tests
        run: npm run test -- --watch=false --browsers=ChromeHeadless
      
      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: angular-app
          path: dist/ci-cd-demo/browser
      
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Deploy to S3 (with caching)
        run: |
          aws s3 sync dist/ci-cd-demo/browser/ s3://${{ secrets.S3_BUCKET }} --delete --exclude "index.html" --cache-control "max-age=31536000"
    
          aws s3 cp dist/ci-cd-demo/browser/index.html s3://${{ secrets.S3_BUCKET }}/index.html --cache-control "no-cache"